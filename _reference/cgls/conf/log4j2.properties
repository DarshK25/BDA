# Quieter Spark logs for demos/screenshots. Remove the --conf line in docker-compose.yml to get full logs.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n
# benign "number of leaves did not match" warning caused by our union of three event types
logger.me.name = org.apache.spark.sql.execution.streaming.MicroBatchExecution
logger.me.level = error
logger.hadoop.name = org.apache.hadoop.util.NativeCodeLoader
logger.hadoop.level = error
