[pytest]
# Pytest configuration for the CGLS project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum version
minversion = 7.0

# Additional command-line options
addopts =
    --verbose
    --strict-markers
    --cov=src/cgls
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-branch
    -ra
    --tb=short

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests across components
    slow: Tests that take longer to run
    kafka: Tests requiring Kafka connection
    spark: Tests requiring Spark session
    ml: Machine learning model tests

# Coverage options
[coverage:run]
source = src/cgls
omit = 
    */tests/*
    */test_*.py
    */__init__.py
    */simulator/*
    */dashboard/*

[coverage:report]
precision = 2
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov
